<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Organizador Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/forms.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: min(400px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px; box-shadow: var(--shadow); }
    .login-box h1 { font-size: 1.3rem; margin-bottom: 4px; }
    .login-box p { color: var(--muted); font-size: .9rem; margin: 0 0 24px; }
    .login-box .field { margin-bottom: 14px; }
    .login-box button { width: 100%; margin-top: 8px; }
    .error { color: var(--danger); font-size: .85rem; margin-top: 8px; display: none; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Organizador Comercial</h1>
    <p>Entre com seu e-mail e senha para acessar.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" name="password" required autocomplete="current-password">
      </div>
      <div class="error" id="erro"></div>
      <button class="btn primary" type="submit" id="submitBtn">Entrar</button>
    </form>
  </div>
  <script type="module">
    const form = document.getElementById('loginForm')
    const erro = document.getElementById('erro')
    const btn = document.getElementById('submitBtn')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      btn.disabled = true
      btn.textContent = 'Entrando…'
      erro.classList.remove('show')

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: form.email.value,
          password: form.password.value,
        }),
      })

      if (res.ok) {
        window.location.href = '/'
      } else {
        const { error } = await res.json()
        erro.textContent = error || 'Erro ao entrar. Tente novamente.'
        erro.classList.add('show')
        btn.disabled = false
        btn.textContent = 'Entrar'
      }
    })
  </script>
</body>
</html>
